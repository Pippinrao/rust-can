[workspace]
resolver = "2"
members = [
    "rust-can-core",
    "rust-can-adapters",
    "rust-can-io",
    "rust-can-notifier",
    "rust-can-cli",
    "rust-can-ffi",
    "benchmarks",
    "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-can/rust-can"
authors = ["rust-can contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# IO / Parsing
bytes = "1"
nom = "7"
flate2 = "1"
smallvec = { version = "1", default-features = false, features = ["union"] }

# Concurrency
crossbeam = "0.8"
parking_lot = "0.12"

# FFI
libloading = "0.8"
inventory = "0.3"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "fat"
codegen-units = 1
