[package]
name = "rust-can-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CAN bus log format readers and writers (ASC, BLF, TRC, CSV, etc.)"

[dependencies]
rust-can-core = { path = "../rust-can-core" }
thiserror.workspace = true
serde.workspace = true
bytes.workspace = true
nom.workspace = true
flate2.workspace = true
smallvec.workspace = true
tracing.workspace = true

[features]
# Toggle on with `--features profile` to enable timing-based profiling
# hooks in the ASC and BLF readers. The hooks are zero-cost when the
# feature is off (they compile to `#[inline(always)] fn noop() {}`).
profile = []

[lints]
workspace = true
